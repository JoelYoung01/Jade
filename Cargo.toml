[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/jade-core",
  "crates/jade-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
jade-core = { path = "crates/jade-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
croner = "2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_yaml = "0.9"
sha2 = "0.10"
notify = "7"
ureq = { version = "3", default-features = true }
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# MutexGuard lifetimes often outlive the last "logical" use while still correct.
significant_drop_tightening = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Domain API takes owned inputs to match IPC deserialization.
needless_pass_by_value = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
