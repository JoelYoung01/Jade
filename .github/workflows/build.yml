name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: jade-windows-x86_64
            # binary produced by the jade-desktop crate
            binary: jade-desktop.exe
          # Uncomment when ready to ship Linux builds:
          # - platform: ubuntu-22.04
          #   artifact: jade-linux-x86_64
          #   binary: jade-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          cp "target/release/${{ matrix.binary }}" dist-artifacts/
          # Platform installers / bundles (nsis, msi, deb, AppImage, …)
          if [ -d target/release/bundle ]; then
            mkdir -p dist-artifacts/bundle
            cp -R target/release/bundle/. dist-artifacts/bundle/
          fi
          ls -laR dist-artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 30
