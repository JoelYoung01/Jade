name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: jade-windows-x86_64
            # Friendly name for the downloadable installer artifact
            installer_name: Jade-windows-x86_64-setup.exe
            # Tauri NSIS output glob (versioned)
            installer_glob: target/release/bundle/nsis/*-setup.exe
          # Uncomment when ready to ship Linux builds:
          # - platform: ubuntu-22.04
          #   artifact: jade-linux-x86_64
          #   installer_name: Jade-linux-x86_64.AppImage
          #   installer_glob: target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm build

      - name: Stage downloadable installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(${{ matrix.installer_glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer matched: ${{ matrix.installer_glob }}" >&2
            find target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          cp "${files[0]}" "dist/${{ matrix.installer_name }}"
          ls -la dist/

      # Direct (unzipped) upload so the Actions UI offers the .exe itself
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.installer_name }}
          archive: false
          if-no-files-found: error
          retention-days: 30
